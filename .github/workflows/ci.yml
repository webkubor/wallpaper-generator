name: CI / Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-main
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  changelog:
    name: Update CHANGELOG
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate CHANGELOG from git log
        run: |
          CHANGELOG_BRANCH=main pnpm changelog
          if [ -n "$(git status --porcelain CHANGELOG.md)" ]; then
            echo "changelog_changed=true" >> "$GITHUB_ENV"
          else
            echo "changelog_changed=false" >> "$GITHUB_ENV"
          fi

      - name: Commit & push CHANGELOG
        if: env.changelog_changed == 'true'
        run: |
          git config user.name "webkubor"
          git config user.email "webkubor@163.com"
          git add CHANGELOG.md
          git commit -m "docs: auto-update CHANGELOG [skip ci]"
          git push origin HEAD:main

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: changelog
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect commits & classify
        id: detect
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$LAST_TAG..HEAD"
          fi
          # 计算是否含语义化 feat / fix commit
          FEAT_COUNT=$(git log "$RANGE" --pretty=format:'%s' | grep -icE "(^feat|^feature|feat\(|^Feat)") || true
          FIX_COUNT=$(git log "$RANGE" --pretty=format:'%s' | grep -icE "(^fix|fix\(|^Fix)") || true
          echo "has_feat=$([ "$FEAT_COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_fix=$([ "$FIX_COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

      - name: Determine next version & whether to release
        id: version
        shell: bash
        run: |
          HAS_FEAT="${{ steps.detect.outputs.has_feat }}"
          HAS_FIX="${{ steps.detect.outputs.has_fix }}"
          CURRENT=$(node -p "require('./package.json').version")
          LAST_TAG="${{ steps.detect.outputs.last_tag }}"
          # 若还没有任何 tag：这是首次发布，直接定 v1.0.0
          if [ -z "$LAST_TAG" ]; then
            echo "next_version=1.0.0" >> "$GITHUB_OUTPUT"
            echo "has_releasable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS='.' read -r MAJ MIN PAT <<< "$CURRENT"
          if [ "$HAS_FEAT" = "true" ]; then
            MIN=$((MIN+1)); PAT=0
          else
            PAT=$((PAT+1))
          fi
          echo "next_version=$MAJ.$MIN.$PAT" >> "$GITHUB_OUTPUT"
          if [ "$HAS_FEAT" = "true" ] || [ "$HAS_FIX" = "true" ]; then
            echo "has_releasable=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_releasable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag & Release
        if: steps.version.outputs.has_releasable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.NEXT_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          git config user.name "webkubor"
          git config user.email "webkubor@163.com"
          git add package.json pnpm-lock.yaml 2>/dev/null || true
          git commit -m "chore: release v$NEXT_VERSION [skip ci]" || true
          git push origin HEAD:main || true
          git tag "v$NEXT_VERSION"
          git push origin "v$NEXT_VERSION" || true
          NOTES=$(awk '/^## /{c++} c==1{print}' CHANGELOG.md | head -80)
          gh release create "v$NEXT_VERSION" --title "v$NEXT_VERSION" --notes "$NOTES" || true
